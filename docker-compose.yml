services:
  mongo:
    image: mongo:7.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7.2
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build: .
    env_file: local.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - mongo
      - redis

volumes:
  mongo-data:
